const LineAreaChart=({labels,series,height=170})=>{
  const ref=useRef(null);const chart=useRef(null);
  useEffect(()=>{
    if(!ref.current)return;
    if(chart.current)chart.current.destroy();
    const ctx=ref.current.getContext('2d');
    chart.current=new Chart(ctx,{
      type:'line',
      data:{labels,datasets:series.map(s=>{
        const grad=ctx.createLinearGradient(0,0,0,height);
        grad.addColorStop(0,s.color+'40');grad.addColorStop(1,s.color+'04');
        return{label:s.label,data:s.data,borderColor:s.color,backgroundColor:grad,
          fill:true,tension:.4,borderWidth:2.5,pointRadius:4,
          pointBackgroundColor:s.color,pointBorderColor:'#03071a',pointBorderWidth:2,
          pointHoverRadius:6,pointHoverBackgroundColor:s.color};
      })},
      options:{
        responsive:true,maintainAspectRatio:false,animation:{duration:700,easing:'easeOutQuart'},
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{display:false},
          tooltip:{backgroundColor:'rgba(2,6,22,.95)',borderColor:'rgba(6,182,212,.2)',borderWidth:1,
            titleColor:'#F1F5F9',bodyColor:'#94A3B8',padding:10,cornerRadius:8,
            callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.raw.toLocaleString()}`}}
        },
        scales:{
          x:{grid:{color:'rgba(6,182,212,.04)',drawBorder:false},ticks:{color:'rgba(148,163,184,.3)',font:{size:10,family:'Fira Code'}}},
          y:{grid:{color:'rgba(6,182,212,.04)',drawBorder:false},ticks:{color:'rgba(148,163,184,.3)',font:{size:10,family:'Fira Code'},callback:v=>v>=1000?`${(v/1000).toFixed(0)}k`:v}},
        }
      }
    });
    return()=>{if(chart.current)chart.current.destroy()};
  },[]);
  return<div style={{height}}><canvas ref={ref}/></div>;
};
const BarChart=({labels,data,color='#3B82F6',height=150})=>{
  const ref=useRef(null);const chart=useRef(null);
  const max=Math.max(...data);
  useEffect(()=>{
    if(!ref.current)return;
    if(chart.current)chart.current.destroy();
    chart.current=new Chart(ref.current,{
      type:'bar',
      data:{labels,datasets:[{data,backgroundColor:data.map(v=>v===max?color:color+'44'),
        borderRadius:6,borderSkipped:false,hoverBackgroundColor:color}]},
      options:{
        responsive:true,maintainAspectRatio:false,animation:{duration:700,easing:'easeOutQuart'},
        plugins:{legend:{display:false},
          tooltip:{backgroundColor:'rgba(2,6,22,.95)',borderColor:'rgba(34,197,94,.2)',borderWidth:1,
            titleColor:'#F1F5F9',bodyColor:'#94A3B8',padding:10,cornerRadius:8,
            callbacks:{label:ctx=>`$${ctx.raw.toFixed(2)}`}}},
        scales:{
          x:{grid:{display:false},ticks:{color:'rgba(148,163,184,.3)',font:{size:10,family:'Fira Code'}}},
          y:{grid:{color:'rgba(34,197,94,.05)',drawBorder:false},ticks:{color:'rgba(148,163,184,.3)',font:{size:10,family:'Fira Code'},callback:v=>`$${v}`}},

    return()=>{if(chart.current)chart.current.destroy()};

  return<div style={{height}}><canvas ref={ref}/></div>;
};

const ChatPanel=({open,onClose,messages,setMessages})=>{
  const [input,setInput]=useState('');const [loading,setLoading]=useState(false);
  const endRef=useRef(null);const API_KEY=window.ANTHROPIC_API_KEY||'';
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages,loading]);
  const send=async()=>{
    const txt=input.trim();if(!txt)return;
    const userMsg={role:'user',content:txt};
    setMessages(m=>[...m,userMsg]);setInput('');setLoading(true);
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:SYSTEM_PROMPT,
          messages:[...messages,userMsg].map(m=>({role:m.role,content:m.content}))}),
      });
      const d=await r.json();
      setMessages(m=>[...m,{role:'assistant',content:d.content?.[0]?.text||d.error?.message||'No response'}]);
    }catch(e){setMessages(m=>[...m,{role:'assistant',content:`Error. ${API_KEY?'Check key.':'Set window.ANTHROPIC_API_KEY in console.'}`}]);}
    finally{setLoading(false);}

      :<span key={i}>{p}</span>

    <div className="chat-panel fixed top-0 right-0 bottom-0 flex flex-col z-50"

        style={{minHeight:54,borderBottom:'1px solid rgba(6,182,212,.08)'}}>

        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl flex items-center justify-center"
            style={{background:'linear-gradient(135deg,#06B6D4,#3B82F6)',boxShadow:'0 0 20px rgba(6,182,212,.4)'}}>

            <div className="flex items-center gap-1.5 mono text-xs" style={{color:'#334155'}}>
              <Dot s="ok"/><span>claude-sonnet-4-6</span>

          </div>
        </div>
        <button onClick={onClose} className="w-8 h-8 rounded-lg flex items-center justify-center" style={{color:'#334155',background:'rgba(255,255,255,.04)'}}
          onMouseEnter={e=>e.currentTarget.style.color='#94A3B8'}
          onMouseLeave={e=>e.currentTarget.style.color='#334155'}>
          <Ic n="x" s={14}/>
        </button>
      </div>
      {!API_KEY&&(
        <div className="mx-3 mt-3 px-3 py-2.5 rounded-xl text-xs" style={{background:'rgba(245,158,11,.08)',color:'#FCD34D',border:'1px solid rgba(245,158,11,.2)'}}>
          Set <code className="mono" style={{color:'#4ADE80'}}>window.ANTHROPIC_API_KEY='sk-…'</code> in console to enable chat.

/* ── TASK BOARD ──────────────────────────────────────────────── */
const TaskBoardView=({tasks,setTasks})=>{
  const [drag,setDrag]=useState({id:null,src:null});
  const [over,setOver]=useState(null);
  const [addCol,setAddCol]=useState(null);
  const [addVal,setAddVal]=useState('');
  const COLS=[
    {id:'backlog',label:'Backlog',color:'#334155',icon:'·'},
    {id:'todo',label:'Todo',color:'#6366F1',icon:'·'},
    {id:'running',label:'Running',color:'#3B82F6',icon:'▶'},
    {id:'done',label:'Done',color:'#22C55E',icon:'✓'},
    {id:'failed',label:'Failed',color:'#EF4444',icon:'✕'},
  ];
  const onDS=(e,id,src)=>{setDrag({id,src});e.dataTransfer.effectAllowed='move';};
  const onDO=(e,col)=>{e.preventDefault();setOver(col);};
  const onDrop=(e,col)=>{
    e.preventDefault();setOver(null);if(drag.src===col)return;
    setTasks(t=>t.map(x=>x.id===drag.id?{...x,status:col}:x));
    setDrag({id:null,src:null});
  };
  const addTask=col=>{
    if(!addVal.trim())return;
    setTasks(t=>[...t,{id:`t${Date.now()}`,title:addVal.trim(),status:col,priority:'MED',model:null,tags:[]}]);
    setAddVal('');setAddCol(null);
  };
  return(
    <div className="p-5 h-full overflow-hidden flex flex-col">
      <div className="flex items-center gap-3 mb-4">
        <h2 className="font-semibold text-sm">Task Board</h2>
        <span className="mono text-xs px-2 py-0.5 rounded-full" style={{background:'rgba(255,255,255,.05)',color:'#334155'}}>{tasks.length} tasks</span>
      </div>
      <div className="kanban-scroll flex gap-3 flex-1 overflow-hidden pb-2">
        {COLS.map(col=>{
          const colTasks=tasks.filter(t=>t.status===col.id);
          const isOver=over===col.id;
          return(
            <div key={col.id}
              className={`k-col flex flex-col rounded-2xl ${isOver?'drop-zone':''}`}
              style={{background:'rgba(255,255,255,.02)',border:`1px solid ${isOver?'rgba(59,130,246,.5)':'rgba(255,255,255,.05)'}`,
                height:'100%',transition:'all .15s ease'}}
              onDragOver={e=>onDO(e,col.id)} onDrop={e=>onDrop(e,col.id)} onDragLeave={()=>setOver(null)}>
              {/* Column header */}
              <div className="flex items-center justify-between px-3 py-3 flex-shrink-0"
                style={{borderBottom:'1px solid rgba(255,255,255,.04)'}}>
                <div className="flex items-center gap-2">
                  <div className="w-2 h-2 rounded-full" style={{background:col.color,boxShadow:`0 0 6px ${col.color}`}}/>
                  <span className="text-xs font-semibold" style={{color:'#94A3B8'}}>{col.label}</span>
                  <span className="mono text-xs px-1.5 py-0.5 rounded-full" style={{background:'rgba(255,255,255,.05)',color:'#334155'}}>{colTasks.length}</span>
                </div>
                <button onClick={()=>setAddCol(col.id)} className="w-6 h-6 rounded-lg flex items-center justify-center"
                  style={{color:'#334155',background:'rgba(255,255,255,.04)'}}
                  onMouseEnter={e=>e.currentTarget.style.color='#60A5FA'}
                  onMouseLeave={e=>e.currentTarget.style.color='#334155'}>
                  <Ic n="plus" s={12}/>
                </button>
              </div>
              <div className="flex-1 overflow-y-auto px-2 py-2 flex flex-col gap-2">
                {addCol===col.id&&(
                  <div className="flex gap-1.5 mb-1">
                    <input autoFocus type="text" value={addVal} onChange={e=>setAddVal(e.target.value)}
                      onKeyDown={e=>{if(e.key==='Enter')addTask(col.id);if(e.key==='Escape'){setAddCol(null);setAddVal('');}}}
                      placeholder="Task title…" className="flex-1 text-xs"/>
                    <button onClick={()=>addTask(col.id)} className="px-2 rounded-lg text-xs font-semibold"
                      style={{background:'#3B82F6',color:'#fff'}}>+</button>
                  </div>
                )}
                {colTasks.map(t=>{
                  const pColor=C[t.priority]||'#475569';
                  const mColor=C[t.model]||'#475569';
                  const isRunning=t.status==='running';
                  return(
                    <div key={t.id} draggable onDragStart={e=>onDS(e,t.id,col.id)}
                      className={`card-sm p-3 cursor-grab active:cursor-grabbing select-none ${isRunning?'task-running':''}`}
                      style={{borderLeft:`3px solid ${pColor}`,background:drag.id===t.id?'rgba(59,130,246,.08)':'rgba(15,23,42,.6)'}}>
                      {isRunning&&(
                        <div className="flex items-center gap-1.5 mb-2">
                          <span className="pulse w-1.5 h-1.5 rounded-full" style={{background:'#3B82F6',display:'inline-block'}}/>
                          <span className="mono text-xs" style={{color:'#3B82F6'}}>running</span>
                        </div>
                      )}
                      <div className="text-xs font-medium leading-snug mb-2.5" style={{color:'#CBD5E1'}}>{t.title}</div>
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className="tag" style={{color:pColor,background:`${pColor}18`,border:`1px solid ${pColor}35`}}>{t.priority}</span>
                        {t.model&&<span className="tag" style={{color:mColor,background:`${mColor}15`,border:`1px solid ${mColor}30`}}>{modelShort[t.model]}</span>}
                        {t.tags.map(g=><span key={g} className="tag" style={{color:'#334155',background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.07)'}}>{g}</span>)}
                      </div>
                    </div>
                  );
                })}
                {colTasks.length===0&&!addCol&&(
                  <div className="flex-1 flex items-center justify-center mono text-xs" style={{color:'#1E3A5F',padding:'24px 0'}}>
                    drop here
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* ── CRON JOBS ───────────────────────────────────────────────── */
const CronView=({crons,setCrons})=>{
  const dragIdx=useRef(null);
  const [over,setOver]=useState(null);
  const [paused,setPaused]=useState(new Set());
  const onDS=(e,i)=>{dragIdx.current=i;e.dataTransfer.effectAllowed='move';};
  const onDO=(e,i)=>{e.preventDefault();setOver(i);};
  const onDrop=(e,i)=>{
    e.preventDefault();setOver(null);
    if(dragIdx.current===null||dragIdx.current===i)return;
    const arr=[...crons];const [item]=arr.splice(dragIdx.current,1);arr.splice(i,0,item);
    setCrons(arr);dragIdx.current=null;
  };
  const toggle=id=>setPaused(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const healthy=crons.filter(c=>c.status==='ok').length;
  return(
    <div className="p-5">
      <div className="flex items-center justify-between mb-5">
        <div className="flex items-center gap-3">
          <h2 className="font-semibold text-sm">Cron Jobs</h2>
          <span className="mono text-xs" style={{color:'#334155'}}>drag to reorder</span>
        </div>
        <div className="flex items-center gap-2 px-3 py-1.5 rounded-full"
          style={{background:`rgba(34,197,94,.08)`,border:'1px solid rgba(34,197,94,.15)'}}>
          <Dot s={crons.some(c=>c.status==='error')?'error':crons.some(c=>c.status==='warn')?'warn':'ok'}/>
          <span className="mono text-xs" style={{color:'#22C55E'}}>{healthy}/{crons.length} healthy</span>
        </div>
      </div>
      <div className="card overflow-hidden">
        <div className="grid px-4 py-3 text-xs font-semibold uppercase tracking-wider"
          style={{color:'#1E3A5F',borderBottom:'1px solid rgba(255,255,255,.05)',
            gridTemplateColumns:'28px 1fr 150px 90px 80px 70px 60px'}}>
          <span/><span>Job</span><span>Schedule</span><span>Model</span><span>Status</span><span>Runs</span><span/>
        </div>
        {crons.map((c,i)=>{
          const sc=C[c.model]||'#475569';
          return(
            <div key={c.id} draggable
              onDragStart={e=>onDS(e,i)} onDragOver={e=>onDO(e,i)}
              onDrop={e=>onDrop(e,i)} onDragLeave={()=>setOver(null)}
              className={`grid px-4 py-3.5 items-center ${over===i?'drop-zone':''}`}
              style={{borderBottom:'1px solid rgba(255,255,255,.03)',cursor:'grab',
                opacity:paused.has(c.id)?.45:1,transition:'all .15s ease',
                background:over===i?'rgba(59,130,246,.04)':'transparent',
                gridTemplateColumns:'28px 1fr 150px 90px 80px 70px 60px'}}>
              <span style={{color:'#1E3A5F'}}><Ic n="grip" s={14}/></span>
              <div className="flex items-center gap-2">
                <span className="mono text-xs font-medium" style={{color:'#CBD5E1'}}>{c.name}</span>
                {paused.has(c.id)&&<span className="tag" style={{color:'#F59E0B',background:'rgba(245,158,11,.1)',border:'1px solid rgba(245,158,11,.25)'}}>paused</span>}
                {c.status==='warn'&&!paused.has(c.id)&&<span className="tag" style={{color:'#F59E0B',background:'rgba(245,158,11,.1)',border:'1px solid rgba(245,158,11,.25)'}}>warn</span>}
              </div>
              <span className="mono text-xs" style={{color:'#334155'}}>{c.schedule}</span>
              <span className="tag" style={{color:sc,background:`${sc}18`,border:`1px solid ${sc}30`}}>{modelShort[c.model]||c.model}</span>
              <div className="flex items-center gap-1.5">
                <Dot s={c.status}/><span className="mono text-xs" style={{color:C[c.status]}}>{c.status}</span>
              </div>
              <span className="mono text-xs" style={{color:'#334155'}}>{c.runs.toLocaleString()}</span>
              <button onClick={()=>toggle(c.id)}
                className="flex items-center justify-center w-7 h-7 rounded-lg"
                style={{background:'rgba(255,255,255,.04)',color:paused.has(c.id)?'#22C55E':'#334155',border:'1px solid rgba(255,255,255,.06)'}}
                onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(255,255,255,.15)'}
                onMouseLeave={e=>e.currentTarget.style.borderColor='rgba(255,255,255,.06)'}>
                <Ic n={paused.has(c.id)?'play':'pause'} s={11}/>
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
};

            <span className="font-semibold text-sm">Token Usage (24h)</span>

              {[['Claude','#06B6D4'],['DeepSeek','#A855F7']].map(([l,c])=>(

                </div>

          <LineAreaChart labels={TOKEN_LABELS} series={[{label:'Claude',data:TOKEN_CLAUDE,color:'#06B6D4'},{label:'DeepSeek',data:TOKEN_DEEP,color:'#A855F7'}]}/>

        <div className="card p-5">
          <div className="flex items-center justify-between mb-4">
            <span className="font-semibold text-sm">Daily Cost</span>

          </div>
          <BarChart labels={COST_LABELS} data={COST_DATA} color="#22C55E"/>

      </div>
      <div className="card p-5">
        <div className="font-semibold text-sm mb-4">Model Breakdown</div>
        <div className="space-y-3">
          {[
            {model:'claude-sonnet-4-6',pct:76,cost:22.31,tokens:'413k',color:'#06B6D4'},
            {model:'deepseek-r1',pct:18,cost:5.84,tokens:'98k',color:'#A855F7'},
            {model:'system',pct:6,cost:1.20,tokens:'32k',color:'#334155'},
          ].map(m=>(
            <div key={m.model}>
              <div className="flex justify-between mb-1.5">
                <span className="mono text-xs" style={{color:'#CBD5E1'}}>{m.model}</span>
                <div className="flex gap-4">
                  <span className="mono text-xs" style={{color:'#334155'}}>{m.tokens}</span>
                  <span className="mono text-xs font-semibold" style={{color:m.color}}>${m.cost.toFixed(2)}</span>

                <div className="bar-fill" style={{width:`${m.pct}%`,background:`linear-gradient(90deg,${m.color}66,${m.color})`,boxShadow:`0 0 6px ${m.color}40`}}/>
              </div>

          ))}
        </div>
      </div>

  );
};

/* ── API MONITOR ─────────────────────────────────────────────── */
const APIView=()=>{
  const fmtLat=v=>v===null?'timeout':`${v}ms`;
  const latC=v=>v===null?'#EF4444':v<500?'#22C55E':v<2000?'#F59E0B':'#EF4444';
  return(
    <div className="p-5 space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-semibold text-sm">API Monitor</h2>
        <div className="flex gap-3">
          {[['ok','#22C55E',API_EPS.filter(a=>a.status==='ok').length],
            ['warn','#F59E0B',API_EPS.filter(a=>a.status==='warn').length],
            ['error','#EF4444',API_EPS.filter(a=>a.status==='error').length]].map(([s,c,n])=>(
            <div key={s} className="flex items-center gap-1.5 px-2.5 py-1 rounded-full"
              style={{background:`${c}12`,border:`1px solid ${c}25`}}>
              <Dot s={s}/><span className="mono text-xs" style={{color:c}}>{n} {s}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="card overflow-hidden">
        <div className="grid px-5 py-3 text-xs font-semibold uppercase tracking-wider"
          style={{color:'#1E3A5F',borderBottom:'1px solid rgba(255,255,255,.05)',gridTemplateColumns:'2fr 100px 80px 100px'}}>
          <span>Endpoint</span><span>Latency</span><span>Status</span><span>Uptime</span>
        </div>
        {API_EPS.map(ep=>(
          <div key={ep.id} className="grid px-5 py-4 items-center"
            style={{borderBottom:'1px solid rgba(255,255,255,.03)',gridTemplateColumns:'2fr 100px 80px 100px',
              background:ep.status==='error'?'rgba(239,68,68,.03)':ep.status==='warn'?'rgba(245,158,11,.02)':'transparent'}}>
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-xl flex items-center justify-center"
                style={{background:`rgba(${ep.status==='ok'?'34,197,94':ep.status==='warn'?'245,158,11':'239,68,68'},.1)`,
                  border:`1px solid rgba(${ep.status==='ok'?'34,197,94':ep.status==='warn'?'245,158,11':'239,68,68'},.2)`}}>
                <Ic n="wifi" s={13} cls={`${ep.status==='ok'?'text-green-400':ep.status==='warn'?'text-amber-400':'text-red-400'}`}/>
              </div>
              <span className="mono text-xs font-medium" style={{color:'#CBD5E1'}}>{ep.name}</span>
            </div>
            <span className="mono text-sm font-bold" style={{color:latC(ep.latency),textShadow:`0 0 12px ${latC(ep.latency)}60`}}>{fmtLat(ep.latency)}</span>
            <div className="flex items-center gap-1.5">
              <Dot s={ep.status}/><span className="mono text-xs" style={{color:C[ep.status]}}>{ep.status}</span>
            </div>
            <div>
              <div className="mono text-xs font-bold mb-1" style={{color:ep.uptime===100?'#22C55E':ep.uptime>99?'#3B82F6':ep.uptime>98?'#F59E0B':'#EF4444'}}>
                {ep.uptime}%
              </div>
              <div className="bar-track" style={{width:72}}>
                <div className="bar-fill" style={{width:`${ep.uptime}%`,background:ep.uptime===100?'#22C55E':ep.uptime>99?'#3B82F6':ep.uptime>98?'#F59E0B':'#EF4444'}}/>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="flex items-start gap-3 px-4 py-3.5 rounded-2xl"
        style={{background:'rgba(239,68,68,.06)',border:'1px solid rgba(239,68,68,.2)'}}>
        <div className="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0 mt-0.5"
          style={{background:'rgba(239,68,68,.15)',border:'1px solid rgba(239,68,68,.3)'}}>
          <Ic n="alertC" s={14} cls="text-red-400"/>
        </div>
        <div>
          <div className="font-semibold text-sm mb-1" style={{color:'#F87171'}}>Camofox Webhook unreachable</div>
          <div className="text-xs leading-relaxed" style={{color:'#64748B'}}>POST to <code className="mono" style={{color:'#F87171',background:'rgba(239,68,68,.1)',padding:'1px 4px',borderRadius:3}}>camofox.io/webhook/v2</code> timing out. Retry #3 failed. Cron paused automatically.</div>
        </div>
      </div>
    </div>
  );
};

/* ── LOG STREAM ──────────────────────────────────────────────── */
const LogStreamView=({logs})=>{
  const [filter,setFilter]=useState('ALL');
  const [search,setSearch]=useState('');
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[logs]);
  const LEVELS=['ALL','INFO','WARN','ERROR','DEBUG'];
  const filtered=logs.filter(l=>(filter==='ALL'||l.level===filter)&&(!search||l.msg.toLowerCase().includes(search.toLowerCase())||l.src.toLowerCase().includes(search.toLowerCase())));
  return(
    <div className="p-5 h-full overflow-hidden flex flex-col">
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <div className="flex items-center gap-3">
          <h2 className="font-semibold text-sm">Log Stream</h2>
          <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full"
            style={{background:'rgba(34,197,94,.08)',border:'1px solid rgba(34,197,94,.2)'}}>
            <span className="pulse w-1.5 h-1.5 rounded-full" style={{background:'#22C55E',display:'inline-block'}}/>
            <span className="mono text-xs" style={{color:'#22C55E'}}>live</span>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <input type="text" value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="Search logs…" style={{width:150,fontSize:12,padding:'5px 10px'}}/>
          <div className="flex gap-1">
            {LEVELS.map(l=>(
              <button key={l} onClick={()=>setFilter(l)}
                className="mono text-xs px-2.5 py-1.5 rounded-lg transition-all"
                style={{
                  background:filter===l?(logColor[l]||'#06B6D4'):'rgba(255,255,255,.04)',
                  color:filter===l?'#020616':(logColor[l]||'rgba(148,163,184,.4)'),
                  border:`1px solid ${filter===l?'transparent':'rgba(255,255,255,.06)'}`,
                  fontWeight:filter===l?700:400,
                  boxShadow:filter===l?`0 0 12px ${logColor[l]||'#06B6D4'}60`:'none',
                }}>
                {l}
              </button>
            ))}
          </div>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto rounded-2xl p-2" style={{background:'rgba(2,6,22,.85)',backdropFilter:'blur(12px)',border:'1px solid rgba(6,182,212,.08)'}}>
        {filtered.map((l,i)=>(
          <div key={l.id} className="flex gap-3 px-3 py-1.5 rounded-lg log-in"
            style={{background:logBg[l.level],fontFamily:'Fira Code',fontSize:11}}>
            <span style={{color:'#1E3A5F',flexShrink:0}}>{fmtTs(l.ts)}</span>
            <span className="font-bold w-12 flex-shrink-0" style={{color:logColor[l.level]}}>{l.level}</span>
            <span className="px-1.5 rounded flex-shrink-0" style={{color:'#334155',background:'rgba(255,255,255,.04)'}}>{l.src}</span>
            <span style={{color:'#64748B'}} className="flex-1">{l.msg}</span>
          </div>
        ))}
        <div ref={endRef}/>
      </div>
      <div className="mt-2 mono text-xs" style={{color:'#1E3A5F'}}>{filtered.length} entries{search||filter!=='ALL'?' · filtered':''}</div>
    </div>
  );
};

/* ── APP ─────────────────────────────────────────────────────── */
const App=()=>{
  const [view,setView]=useState('overview');
  const [col,setCol]=useState(false);
  const [chatOpen,setChatOpen]=useState(true);
  const [tasks,setTasks]=useState(TASKS);
  const [contacts,setContacts]=useState(CRM);
  const [crons,setCrons]=useState(CRONS);
  const [logs,setLogs]=useState(INIT_LOGS);
  const [chatMsgs,setChatMsgs]=useState(INIT_CHAT);
  const [time,setTime]=useState(new Date());

  useEffect(()=>{const t=setInterval(()=>setTime(new Date()),1000);return()=>clearInterval(t);},[]);
  useEffect(()=>{const t=setInterval(()=>setLogs(l=>[...l,genLog()].slice(-500)),9000);return()=>clearInterval(t);},[]);

  const renderView=()=>{
    switch(view){
      case'overview':return<OverviewView tasks={tasks} logs={logs} time={time}/>;
      case'tasks':return<TaskBoardView tasks={tasks} setTasks={setTasks}/>;
      case'crm':return<CRMView contacts={contacts} setContacts={setContacts}/>;
      case'cron':return<CronView crons={crons} setCrons={setCrons}/>;
      case'usage':return<UsageView/>;
      case'api':return<APIView/>;
      case'logs':return<LogStreamView logs={logs}/>;
    }
  };

  return(
    <div className="flex h-screen overflow-hidden" style={{background:'#020616'}}>
      <Sidebar view={view} setView={v=>{setView(v);}} col={col} setCol={setCol} onChat={()=>setChatOpen(o=>!o)}/>
      <div className="flex flex-col flex-1 overflow-hidden main-area">
        <TopBar time={time} view={view} onToggle={()=>setCol(c=>!c)} onChat={()=>setChatOpen(o=>!o)}/>
        <main className="flex-1 overflow-hidden" style={{background:'transparent'}}>
          {renderView()}
        </main>
      </div>
      {chatOpen&&<ChatPanel open messages={chatMsgs} setMessages={setChatMsgs} onClose={()=>setChatOpen(false)}/>}
      <BottomNav view={view} setView={setView} onChat={()=>setChatOpen(o=>!o)}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

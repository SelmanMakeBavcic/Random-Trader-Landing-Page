/* ─── CHART: Line Area ────────────────────────────────────────────── */
const LineAreaChart=({labels,series,height=160})=>{
  const ref=useRef(null);const chart=useRef(null);
  useEffect(()=>{
    if(!ref.current)return;
    if(chart.current)chart.current.destroy();
    chart.current=new Chart(ref.current,{
      type:'line',
      data:{labels,datasets:series.map(s=>({
        label:s.label,data:s.data,borderColor:s.color,
        backgroundColor:s.color+'18',fill:true,tension:.4,
        borderWidth:2,pointRadius:3,pointBackgroundColor:s.color,
        pointBorderColor:'#020617',pointBorderWidth:2,
      }))},
      options:{
        responsive:true,maintainAspectRatio:false,animation:{duration:600},
        interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:true,position:'top',labels:{color:'#94A3B8',font:{size:11,family:'Fira Code'},boxWidth:10,padding:12}},
          tooltip:{backgroundColor:'#1E293B',borderColor:'#334155',borderWidth:1,titleColor:'#F8FAFC',bodyColor:'#94A3B8',
            callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.raw.toLocaleString()}`}}},
        scales:{
          x:{grid:{color:'#334155',drawBorder:false},ticks:{color:'#475569',font:{size:10,family:'Fira Code'}}},
          y:{grid:{color:'#334155',drawBorder:false},ticks:{color:'#475569',font:{size:10,family:'Fira Code'},callback:v=>v>=1000?`${(v/1000).toFixed(0)}k`:v}},
        }
      }
    });
    return()=>{if(chart.current)chart.current.destroy();};
  },[]);
  return<div style={{height}}><canvas ref={ref}/></div>;
};

    if(!ref.current)return;

    chart.current=new Chart(ref.current,{
      type:'bar',
      data:{labels,datasets:[{data,backgroundColor:data.map(v=>v===Math.max(...data)?color:color+'55'),borderRadius:5,borderSkipped:false}]},
      options:{
        responsive:true,maintainAspectRatio:false,animation:{duration:600},
        plugins:{legend:{display:false},tooltip:{backgroundColor:'#1E293B',borderColor:'#334155',borderWidth:1,titleColor:'#F8FAFC',bodyColor:'#94A3B8',callbacks:{label:ctx=>`$${ctx.raw.toFixed(2)}`}}},

    });
    return()=>{if(chart.current)chart.current.destroy();};
  },[]);
  return<div style={{height}}><canvas ref={ref}/></div>;

/* ─── CHAT PANEL ─────────────────────────────────────────────────── */
const ChatPanel=({open,onClose,messages,setMessages})=>{
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const bottomRef=useRef(null);
  const API_KEY=window.ANTHROPIC_API_KEY||'';

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'});},[messages,loading]);

  const send=async()=>{
    const txt=input.trim();if(!txt)return;
    const userMsg={role:'user',content:txt};
    setMessages(m=>[...m,userMsg]);
    setInput('');setLoading(true);
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:SYSTEM_PROMPT,
          messages:[...messages,userMsg].map(m=>({role:m.role,content:m.content}))}),
      });
      const d=await r.json();
      const text=d.content?.[0]?.text||d.error?.message||'No response';
      setMessages(m=>[...m,{role:'assistant',content:text}]);
    }catch(e){
      setMessages(m=>[...m,{role:'assistant',content:`Connection error. ${API_KEY?'Check API key.':'Set window.ANTHROPIC_API_KEY in console.'}`}]);
    }finally{setLoading(false);}
  };

  const renderMsg=txt=>{
    const parts=txt.split(/(`[^`]+`)/g);
    return parts.map((p,i)=>p.startsWith('`')&&p.endsWith('`')
      ?<code key={i} className="mono px-1.5 py-0.5 rounded text-xs" style={{background:'#1E293B',color:'#22C55E'}}>{p.slice(1,-1)}</code>
      :<span key={i}>{p}</span>);
  };

  if(!open)return null;
  return(
    <div className="chat-panel chat-slide fixed top-0 right-0 bottom-0 flex flex-col z-50"
      style={{width:340,background:'#0A1628',borderLeft:'1px solid #1E293B'}}>
      <div className="flex items-center justify-between px-4 py-3 flex-shrink-0"
        style={{borderBottom:'1px solid #1E293B',minHeight:52}}>
        <div className="flex items-center gap-2">
          <div className="w-7 h-7 rounded-lg flex items-center justify-center"
            style={{background:'linear-gradient(135deg,#3B82F6,#6366F1)'}}>
            <Ic n="bot" s={13} cls="text-white"/>
          </div>
          <div>
            <div className="text-sm font-semibold">Hermes</div>
            <div className="text-xs flex items-center gap-1" style={{color:'#64748B'}}>
              <Dot s="ok"/><span>claude-sonnet-4-6</span>
            </div>
          </div>
        </div>
        <button onClick={onClose} className="p-1.5 rounded-lg" style={{color:'#475569'}}
          onMouseEnter={e=>e.currentTarget.style.color='#94A3B8'}
          onMouseLeave={e=>e.currentTarget.style.color='#475569'}
        ><Ic n="x" s={15}/></button>
      </div>
      {!API_KEY&&(
        <div className="mx-3 mt-3 px-3 py-2 rounded-lg text-xs" style={{background:'#1E293B',color:'#F59E0B',border:'1px solid #F59E0B44'}}>
          Set <code className="mono" style={{color:'#22C55E'}}>window.ANTHROPIC_API_KEY='sk-…'</code> in console to enable chat.
        </div>
      )}
      <div className="flex-1 overflow-y-auto px-3 py-3 flex flex-col gap-3">
        {messages.map((m,i)=>(
          <div key={i} className={`flex gap-2 ${m.role==='user'?'flex-row-reverse':''}`}>
            <div className={`w-6 h-6 rounded-full flex-shrink-0 flex items-center justify-center text-xs font-bold`}
              style={{background:m.role==='user'?'linear-gradient(135deg,#6366F1,#A855F7)':'linear-gradient(135deg,#3B82F6,#22C55E)',color:'#fff'}}>
              {m.role==='user'?'M':<Ic n="bot" s={11}/>}
            </div>
            <div className={`rounded-xl px-3 py-2 text-sm max-w-[75%] leading-relaxed`}
              style={{background:m.role==='user'?'#1E293B':'#0F172A',color:'#CBD5E1',border:'1px solid #334155',
                borderRadius:m.role==='user'?'12px 12px 4px 12px':'12px 12px 12px 4px'}}>
              {renderMsg(m.content)}
            </div>
          </div>
        ))}
        {loading&&(
          <div className="flex gap-2">
            <div className="w-6 h-6 rounded-full flex items-center justify-center"
              style={{background:'linear-gradient(135deg,#3B82F6,#22C55E)'}}>
              <Ic n="bot" s={11} cls="text-white"/>
            </div>
            <div className="flex items-center gap-1.5 px-4 py-3 rounded-xl" style={{background:'#0F172A',border:'1px solid #334155'}}>
              <span className="b1 w-1.5 h-1.5 rounded-full" style={{background:'#3B82F6'}}/>
              <span className="b2 w-1.5 h-1.5 rounded-full" style={{background:'#3B82F6'}}/>
              <span className="b3 w-1.5 h-1.5 rounded-full" style={{background:'#3B82F6'}}/>
            </div>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>
      <div className="px-3 pb-4 flex-shrink-0" style={{borderTop:'1px solid #1E293B',paddingTop:12}}>
        <div className="flex gap-2">
          <input type="text" value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()}
            placeholder="Ask Hermes…" className="flex-1 text-sm"
            style={{background:'#1E293B',border:'1px solid #334155',borderRadius:8,color:'#F8FAFC',padding:'8px 12px',outline:'none',fontSize:13}}
          />
          <button onClick={send} disabled={loading||!input.trim()}
            className="flex items-center justify-center rounded-lg flex-shrink-0"
            style={{background:loading||!input.trim()?'#1E293B':'#3B82F6',color:'#fff',width:38,height:38,border:'none',opacity:loading?0.6:1}}>
            <Ic n="send" s={14}/>
          </button>
        </div>
      </div>
    </div>
  );
};

/* ─── VIEW: TASK BOARD ───────────────────────────────────────────── */
const TaskBoardView=({tasks,setTasks})=>{
  const [drag,setDrag]=useState({id:null,src:null});
  const [over,setOver]=useState(null);
  const [addCol,setAddCol]=useState(null);
  const [addVal,setAddVal]=useState('');
  const COLS=[
    {id:'backlog',label:'Backlog',color:'#475569'},
    {id:'todo',label:'Todo',color:'#6366F1'},
    {id:'running',label:'Running',color:'#3B82F6'},
    {id:'done',label:'Done',color:'#22C55E'},
    {id:'failed',label:'Failed',color:'#EF4444'},
  ];
  const onDragStart=(e,id,src)=>{setDrag({id,src});e.dataTransfer.effectAllowed='move';};
  const onDragOver=(e,col)=>{e.preventDefault();setOver(col);};
  const onDrop=(e,col)=>{
    e.preventDefault();setOver(null);
    if(drag.src===col)return;
    setTasks(t=>t.map(x=>x.id===drag.id?{...x,status:col}:x));
    setDrag({id:null,src:null});
  };
  const addTask=(col)=>{
    if(!addVal.trim())return;
    setTasks(t=>[...t,{id:`t${Date.now()}`,title:addVal.trim(),status:col,priority:'MED',model:null,tags:[]}]);
    setAddVal('');setAddCol(null);
  };
  return(
    <div className="p-4 md:p-6 h-full overflow-hidden flex flex-col">
      <div className="flex items-center justify-between mb-4">
        <h2 className="font-semibold text-sm">Task Board <span className="mono ml-2 text-xs" style={{color:'#475569'}}>{tasks.length} tasks</span></h2>
      </div>
      <div className="kanban-scroll flex gap-3 flex-1 overflow-hidden pb-2">
        {COLS.map(col=>{
          const colTasks=tasks.filter(t=>t.status===col.id);
          const isOver=over===col.id;
          return(
            <div key={col.id} className={`k-col flex flex-col gap-2 rounded-xl p-3 ${isOver?'drop-zone':''}`}
              style={{background:'#0F172A',border:`1px solid ${isOver?'#3B82F6':'#1E293B'}`,height:'100%',overflowY:'auto'}}
              onDragOver={e=>onDragOver(e,col.id)} onDrop={e=>onDrop(e,col.id)}
              onDragLeave={()=>setOver(null)}>
              <div className="flex items-center justify-between mb-1 sticky top-0" style={{background:'#0F172A',paddingBottom:4}}>
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full" style={{background:col.color}}/>
                  <span className="text-xs font-semibold">{col.label}</span>
                  <span className="mono text-xs px-1.5 py-0.5 rounded" style={{background:'#1E293B',color:'#64748B'}}>{colTasks.length}</span>
                </div>
                <button onClick={()=>setAddCol(col.id)} className="p-1 rounded" style={{color:'#475569'}}
                  onMouseEnter={e=>e.currentTarget.style.color='#94A3B8'}
                  onMouseLeave={e=>e.currentTarget.style.color='#475569'}>
                  <Ic n="plus" s={13}/>
                </button>
              </div>
              {addCol===col.id&&(
                <div className="flex gap-1 mb-1">
                  <input autoFocus type="text" value={addVal} onChange={e=>setAddVal(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter')addTask(col.id);if(e.key==='Escape'){setAddCol(null);setAddVal('');}}}
                    placeholder="Task title…" className="flex-1 text-xs" style={{padding:'6px 8px',borderRadius:6}}/>
                  <button onClick={()=>addTask(col.id)} className="px-2 rounded text-xs" style={{background:'#3B82F6',color:'#fff'}}>+</button>
                </div>
              )}
              {colTasks.map(t=>(
                <div key={t.id} draggable
                  onDragStart={e=>onDragStart(e,t.id,col.id)}
                  className="card-sm p-3 cursor-grab active:cursor-grabbing select-none"
                  style={{transition:'transform .1s',background:drag.id===t.id?'#1E293B':'#0F172A'}}>
                  <div className="text-xs font-medium mb-2 leading-snug" style={{color:'#CBD5E1'}}>{t.title}</div>
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <span className="tag" style={{color:priorityColor[t.priority],background:priorityColor[t.priority]+'15',border:`1px solid ${priorityColor[t.priority]}40`}}>
                      {t.priority}
                    </span>
                    {t.model&&<span className="tag" style={{color:modelColor[t.model]||'#475569',background:(modelColor[t.model]||'#475569')+'15',border:`1px solid ${(modelColor[t.model]||'#475569')}40`}}>
                      {modelShort[t.model]||t.model}
                    </span>}
                    {t.tags.map(g=><span key={g} className="tag" style={{color:'#64748B',background:'#1E293B',border:'1px solid #334155'}}>{g}</span>)}
                  </div>
                </div>
              ))}
              {colTasks.length===0&&!addCol&&(
                <div className="flex-1 flex items-center justify-center text-xs" style={{color:'#334155',padding:'20px 0'}}>
                  Drop here
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

  const [addName,setAddName]=useState('');

    {id:'lead',label:'Lead',color:'#6366F1'},
    {id:'qualified',label:'Qualified',color:'#3B82F6'},
    {id:'proposal',label:'Proposal',color:'#F59E0B'},
    {id:'closed',label:'Closed',color:'#22C55E'},
  ];
  const totalPipeline=contacts.filter(c=>c.stage!=='closed').reduce((a,c)=>a+c.value,0);
  const closed=contacts.filter(c=>c.stage==='closed').reduce((a,c)=>a+c.value,0);
  const onDragStart=(e,id,src)=>{setDrag({id,src});e.dataTransfer.effectAllowed='move';};
  const onDragOver=(e,s)=>{e.preventDefault();setOver(s);};
  const onDrop=(e,s)=>{
    e.preventDefault();setOver(null);
    if(drag.src===s)return;
    setContacts(c=>c.map(x=>x.id===drag.id?{...x,stage:s}:x));
    setDrag({id:null,src:null});
  };
  const addContact=stage=>{
    if(!addName.trim())return;
    setContacts(c=>[...c,{id:`c${Date.now()}`,name:addName.trim(),company:'—',stage,value:0}]);
    setAddName('');setAddStage(null);
  };
  return(
    <div className="p-4 md:p-6 h-full overflow-hidden flex flex-col">
      <div className="flex items-center justify-between mb-4">
        <h2 className="font-semibold text-sm">CRM Pipeline</h2>
        <div className="flex gap-4">
          <div className="text-right">
            <div className="mono text-xs" style={{color:'#475569'}}>Pipeline</div>
            <div className="mono text-sm font-bold" style={{color:'#3B82F6'}}>${totalPipeline.toLocaleString()}</div>
          </div>
          <div className="text-right">
            <div className="mono text-xs" style={{color:'#475569'}}>Closed</div>
            <div className="mono text-sm font-bold" style={{color:'#22C55E'}}>${closed.toLocaleString()}</div>
          </div>
        </div>
      </div>
      <div className="kanban-scroll flex gap-3 flex-1 overflow-hidden pb-2">
        {STAGES.map(s=>{
          const cols=contacts.filter(c=>c.stage===s.id);
          const stageVal=cols.reduce((a,c)=>a+c.value,0);
          const isOver=over===s.id;
          return(
            <div key={s.id} className={`k-col flex flex-col gap-2 rounded-xl p-3 ${isOver?'drop-zone':''}`}
              style={{background:'#0F172A',border:`1px solid ${isOver?'#3B82F6':'#1E293B'}`,height:'100%',overflowY:'auto'}}
              onDragOver={e=>onDragOver(e,s.id)} onDrop={e=>onDrop(e,s.id)}
              onDragLeave={()=>setOver(null)}>
              <div className="flex items-center justify-between mb-1 sticky top-0" style={{background:'#0F172A',paddingBottom:4}}>
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full" style={{background:s.color}}/>
                  <span className="text-xs font-semibold">{s.label}</span>
                  <span className="mono text-xs px-1.5 py-0.5 rounded" style={{background:'#1E293B',color:'#64748B'}}>{cols.length}</span>
                </div>
                <button onClick={()=>setAddStage(s.id)} className="p-1 rounded" style={{color:'#475569'}}
                  onMouseEnter={e=>e.currentTarget.style.color='#94A3B8'}
                  onMouseLeave={e=>e.currentTarget.style.color='#475569'}>
                  <Ic n="plus" s={13}/>
                </button>
              </div>
              <div className="mono text-xs mb-2" style={{color:s.color}}>${stageVal.toLocaleString()}</div>
              {addStage===s.id&&(
                <div className="flex gap-1 mb-1">
                  <input autoFocus type="text" value={addName} onChange={e=>setAddName(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter')addContact(s.id);if(e.key==='Escape'){setAddStage(null);setAddName('');}}}
                    placeholder="Contact name…" className="flex-1 text-xs" style={{padding:'6px 8px',borderRadius:6}}/>
                  <button onClick={()=>addContact(s.id)} className="px-2 rounded text-xs" style={{background:'#3B82F6',color:'#fff'}}>+</button>
                </div>
              )}
              {cols.map(c=>(
                <div key={c.id} draggable onDragStart={e=>onDragStart(e,c.id,s.id)}
                  className="card-sm p-3 cursor-grab active:cursor-grabbing select-none">
                  <div className="flex items-start justify-between mb-1">
                    <div>
                      <div className="text-xs font-semibold" style={{color:'#CBD5E1'}}>{c.name}</div>
                      <div className="text-xs" style={{color:'#475569'}}>{c.company}</div>
                    </div>
                    {c.value>0&&<span className="mono text-xs font-bold" style={{color:s.color}}>${c.value.toLocaleString()}</span>}
                  </div>
                  <div className="flex items-center gap-1 mt-2">
                    <div className="w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold"
                      style={{background:s.color+'22',color:s.color}}>
                      {c.name[0]}
                    </div>
                    <span className="tag" style={{color:s.color,background:s.color+'18',border:`1px solid ${s.color}40`}}>{stageLabel[c.stage]}</span>
                  </div>
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* ─── VIEW: CRON JOBS ────────────────────────────────────────────── */
const CronView=({crons,setCrons})=>{
  const dragIdx=useRef(null);
  const [over,setOver]=useState(null);
  const [paused,setPaused]=useState(new Set());
  const onDragStart=(e,i)=>{dragIdx.current=i;e.dataTransfer.effectAllowed='move';};
  const onDragOver=(e,i)=>{e.preventDefault();setOver(i);};
  const onDrop=(e,i)=>{
    e.preventDefault();setOver(null);
    if(dragIdx.current===null||dragIdx.current===i)return;
    const arr=[...crons];const [item]=arr.splice(dragIdx.current,1);arr.splice(i,0,item);
    setCrons(arr);dragIdx.current=null;
  };
  const togglePause=id=>setPaused(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  return(
    <div className="p-4 md:p-6">
      <div className="flex items-center justify-between mb-4">
        <h2 className="font-semibold text-sm">Cron Jobs <span className="mono ml-2 text-xs" style={{color:'#475569'}}>drag to reorder</span></h2>
        <div className="flex items-center gap-2">
          <Dot s={crons.some(c=>c.status==='error')?'error':crons.some(c=>c.status==='warn')?'warn':'ok'}/>
          <span className="text-xs" style={{color:'#64748B'}}>{crons.filter(c=>c.status==='ok').length}/{crons.length} healthy</span>
        </div>
      </div>
      <div className="card overflow-hidden">
        {/* Header */}
        <div className="grid gap-3 px-4 py-2.5 text-xs font-semibold" style={{color:'#475569',borderBottom:'1px solid #1E293B',gridTemplateColumns:'24px 1fr 140px 80px 60px 80px 70px'}}>
          <span/>
          <span>Name</span>
          <span>Schedule</span>
          <span>Model</span>
          <span>Status</span>
          <span>Runs</span>
          <span/>
        </div>
        {crons.map((c,i)=>(
          <div key={c.id} draggable
            onDragStart={e=>onDragStart(e,i)} onDragOver={e=>onDragOver(e,i)}
            onDrop={e=>onDrop(e,i)} onDragLeave={()=>setOver(null)}
            className={`grid gap-3 px-4 py-3 items-center text-sm transition-all ${over===i?'drop-zone':''}`}
            style={{borderBottom:'1px solid #1E293B',cursor:'grab',opacity:paused.has(c.id)?0.5:1,
              gridTemplateColumns:'24px 1fr 140px 80px 60px 80px 70px'}}>
            <span style={{color:'#334155',cursor:'grab'}}><Ic n="grip" s={14}/></span>
            <div>
              <span className="mono font-medium text-xs" style={{color:'#CBD5E1'}}>{c.name}</span>
              {paused.has(c.id)&&<span className="ml-2 tag text-xs" style={{color:'#F59E0B',background:'#F59E0B15',border:'1px solid #F59E0B40'}}>paused</span>}
            </div>
            <span className="mono text-xs" style={{color:'#64748B'}}>{c.schedule}</span>
            <span className="tag text-xs" style={{color:modelColor[c.model]||'#475569',background:(modelColor[c.model]||'#475569')+'15',border:`1px solid ${(modelColor[c.model]||'#475569')}40`}}>
              {modelShort[c.model]||c.model}
            </span>
            <div className="flex items-center gap-1.5">
              <Dot s={c.status}/>
              <span className="text-xs" style={{color:statusColor[c.status]}}>{c.status}</span>
            </div>
            <span className="mono text-xs" style={{color:'#64748B'}}>{c.runs.toLocaleString()}</span>
            <div className="flex gap-1">
              <button onClick={()=>togglePause(c.id)} className="p-1.5 rounded-lg" style={{color:paused.has(c.id)?'#22C55E':'#475569',background:'#1E293B'}}
                onMouseEnter={e=>e.currentTarget.style.color='#94A3B8'}
                onMouseLeave={e=>e.currentTarget.style.color=paused.has(c.id)?'#22C55E':'#475569'}>
                <Ic n={paused.has(c.id)?'play':'pause'} s={12}/>
              </button>
            </div>
          </div>
        ))}
      </div>
      <div className="mt-4 text-xs" style={{color:'#334155'}}>Drag rows to reorder priority. Click pause to temporarily disable a job.</div>
    </div>
  );
};

/* ─── VIEW: API MONITOR ──────────────────────────────────────────── */
const APIView=()=>{
  const fmtLatency=v=>v===null?'timeout':`${v}ms`;
  const latColor=v=>v===null?'#EF4444':v<500?'#22C55E':v<2000?'#F59E0B':'#EF4444';
  return(
    <div className="p-4 md:p-6">
      <div className="flex items-center justify-between mb-4">
        <h2 className="font-semibold text-sm">API Monitor</h2>
        <div className="flex items-center gap-3">
          <div className="flex items-center gap-1.5"><Dot s="ok"/><span className="text-xs" style={{color:'#64748B'}}>{API_EPS.filter(a=>a.status==='ok').length} OK</span></div>
          <div className="flex items-center gap-1.5"><Dot s="warn"/><span className="text-xs" style={{color:'#64748B'}}>{API_EPS.filter(a=>a.status==='warn').length} Warn</span></div>
          <div className="flex items-center gap-1.5"><Dot s="error"/><span className="text-xs" style={{color:'#64748B'}}>{API_EPS.filter(a=>a.status==='error').length} Error</span></div>
        </div>
      </div>
      <div className="card overflow-hidden">
        <div className="grid gap-4 px-4 py-2.5 text-xs font-semibold" style={{color:'#475569',borderBottom:'1px solid #1E293B',gridTemplateColumns:'2fr 90px 70px 80px'}}>
          <span>Endpoint</span><span>Latency</span><span>Status</span><span>Uptime</span>
        </div>
        {API_EPS.map(ep=>(
          <div key={ep.id} className="grid gap-4 px-4 py-4 items-center" style={{borderBottom:'1px solid #0F172A',gridTemplateColumns:'2fr 90px 70px 80px'}}>
            <div className="flex items-center gap-2.5">
              <div className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:'#1E293B',color:'#64748B'}}>
                <Ic n="wifi" s={13}/>
              </div>
              <span className="mono text-xs font-medium" style={{color:'#CBD5E1'}}>{ep.name}</span>
            </div>
            <div>
              <span className="mono text-sm font-bold" style={{color:latColor(ep.latency)}}>{fmtLatency(ep.latency)}</span>
            </div>
            <div className="flex items-center gap-1.5">
              <Dot s={ep.status}/>
              <span className="mono text-xs" style={{color:statusColor[ep.status]}}>{ep.status}</span>
            </div>
            <div>
              <div className="mono text-xs font-bold mb-1" style={{color:ep.uptime===100?'#22C55E':ep.uptime>99?'#3B82F6':ep.uptime>98?'#F59E0B':'#EF4444'}}>
                {ep.uptime}%
              </div>
              <div className="bar-bg" style={{width:72}}>
                <div className="bar-fill" style={{width:`${ep.uptime}%`,background:ep.uptime===100?'#22C55E':ep.uptime>99?'#3B82F6':ep.uptime>98?'#F59E0B':'#EF4444'}}/>
              </div>
            </div>
          </div>
        ))}
      </div>
      {/* Camofox warning card */}
      <div className="mt-4 px-4 py-3 rounded-xl flex items-start gap-3"
        style={{background:'#EF444410',border:'1px solid #EF444430'}}>
        <Ic n="alertC" s={15} cls="flex-shrink-0 mt-0.5" style={{color:'#EF4444'}}/>
        <div>
          <div className="text-sm font-semibold mb-0.5" style={{color:'#EF4444'}}>Camofox Webhook unreachable</div>

        </div>
      </div>
    </div>
  );
};

/* ─── VIEW: LOG STREAM ───────────────────────────────────────────── */
const LogStreamView=({logs})=>{
  const [filter,setFilter]=useState('ALL');
  const [search,setSearch]=useState('');
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[logs]);
  const LEVELS=['ALL','INFO','WARN','ERROR','DEBUG'];
  const filtered=logs.filter(l=>(filter==='ALL'||l.level===filter)&&(search===''||l.msg.toLowerCase().includes(search.toLowerCase())||l.src.toLowerCase().includes(search.toLowerCase())));
  return(
    <div className="p-4 md:p-6 h-full overflow-hidden flex flex-col">
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div className="flex items-center gap-2">
          <h2 className="font-semibold text-sm">Log Stream</h2>
          <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-full" style={{background:'#22C55E18',border:'1px solid #22C55E40'}}>
            <span className="pulse w-1.5 h-1.5 rounded-full" style={{background:'#22C55E'}}/>
            <span className="mono text-xs" style={{color:'#22C55E'}}>live</span>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <input type="text" value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="Search…" className="text-xs" style={{width:140,padding:'5px 10px',borderRadius:6}}/>
          <div className="flex gap-1">
            {LEVELS.map(l=>(
              <button key={l} onClick={()=>setFilter(l)}
                className="mono text-xs px-2 py-1 rounded"
                style={{background:filter===l?logColor[l]||'#3B82F6':'#1E293B',
                  color:filter===l?'#020617':logColor[l]||'#64748B',
                  border:`1px solid ${filter===l?'transparent':'#334155'}`}}>
                {l}
              </button>
            ))}
          </div>
        </div>
      </div>
      <div className="card flex-1 overflow-y-auto p-2 font-mono text-xs" style={{background:'#020617'}}>
        {filtered.map((l,i)=>(
          <div key={l.id} className="flex gap-2 px-2 py-1.5 rounded log-in hover:bg-white hover:bg-opacity-5"
            style={{background:i===filtered.length-1?logBg[l.level]:'transparent'}}>
            <span style={{color:'#334155'}}>{fmtTs(l.ts)}</span>
            <span className="font-bold w-12 flex-shrink-0" style={{color:logColor[l.level]}}>{l.level}</span>
            <span className="px-1.5 py-0 rounded flex-shrink-0" style={{color:'#475569',background:'#1E293B'}}>{l.src}</span>
            <span style={{color:'#94A3B8'}} className="flex-1">{l.msg}</span>
          </div>
        ))}
        <div ref={endRef}/>
      </div>
      <div className="mt-1 mono text-xs" style={{color:'#334155'}}>{filtered.length} entries{search||filter!=='ALL'?' (filtered)':''}</div>
    </div>
  );
};

/* ─── APP ────────────────────────────────────────────────────────── */
const App=()=>{
  const [view,setView]=useState('overview');
  const [collapsed,setCollapsed]=useState(false);
  const [chatOpen,setChatOpen]=useState(true);
  const [tasks,setTasks]=useState(TASKS);
  const [contacts,setContacts]=useState(CRM);
  const [crons,setCrons]=useState(CRONS);
  const [logs,setLogs]=useState(INIT_LOGS);
  const [chatMsgs,setChatMsgs]=useState(INIT_CHAT);
  const [time,setTime]=useState(new Date());

  useEffect(()=>{
    const t=setInterval(()=>setTime(new Date()),1000);
    return()=>clearInterval(t);
  },[]);

  useEffect(()=>{
    const t=setInterval(()=>{
      setLogs(l=>[...l,genLog()].slice(-500));
    },9000);
    return()=>clearInterval(t);
  },[]);

  const renderView=()=>{
    switch(view){
      case'overview':return<OverviewView tasks={tasks} logs={logs} time={time}/>;
      case'tasks':return<TaskBoardView tasks={tasks} setTasks={setTasks}/>;
      case'crm':return<CRMView contacts={contacts} setContacts={setContacts}/>;
      case'cron':return<CronView crons={crons} setCrons={setCrons}/>;
      case'usage':return<UsageView/>;
      case'api':return<APIView/>;
      case'logs':return<LogStreamView logs={logs}/>;
      default:return null;
    }
  };

  return(
    <div className="flex h-screen overflow-hidden" style={{background:'#020617'}}>
      <Sidebar view={view} setView={setView} collapsed={collapsed} setCollapsed={setCollapsed}
        onChat={()=>setChatOpen(o=>!o)}/>
      <div className="flex flex-col flex-1 overflow-hidden main-area"
        style={{paddingLeft:0,paddingBottom:0,transition:'all .22s ease'}}>
        <TopBar time={time} view={view} onMenuToggle={()=>setCollapsed(c=>!c)}
          onChat={()=>setChatOpen(o=>!o)}/>
        <main className="flex-1 overflow-y-auto overflow-x-hidden" style={{background:'#020617'}}>
          {renderView()}
        </main>
      </div>
      {chatOpen&&(
        <ChatPanel open={chatOpen} onClose={()=>setChatOpen(false)}
          messages={chatMsgs} setMessages={setChatMsgs}/>
      )}
      <BottomNav view={view} setView={setView} onChat={()=>setChatOpen(o=>!o)}/>
    </div>
  );
};

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
